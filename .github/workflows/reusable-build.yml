name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
        description: 'Component to build (frontend or backend)'
      node_version:
        type: string
        default: '20'
        description: 'Node.js version for frontend builds'
      go_version:
        type: string
        default: '1.24'
        description: 'Go version for backend builds'
      environment:
        type: string
        default: 'development'
        description: 'Build environment'
      registry:
        type: string
        default: ''
        description: 'Container registry URL'
      push:
        type: boolean
        default: false
        description: 'Whether to push the built image'
    secrets:
      registry_username:
        required: false
        description: 'Container registry username'
      registry_password:
        required: false
        description: 'Container registry password'
    outputs:
      image:
        description: 'Built container image'
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: 'Image digest'
        value: ${{ jobs.build.outputs.digest }}

env:
  NODE_VERSION: ${{ inputs.node_version }}
  GO_VERSION: ${{ inputs.go_version }}
  COMPONENT: ${{ inputs.component }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  build:
    name: Build ${{ inputs.component }}
    runs-on: ubuntu-latest
    outputs:
      image: "${{ steps.build-frontend.outputs.image }}${{ steps.build-backend.outputs.image }}"
      digest: "${{ steps.build-frontend.outputs.digest }}${{ steps.build-backend.outputs.digest }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: inputs.push && inputs.registry != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build Frontend
        if: inputs.component == 'frontend'
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.registry }}/vortyx-frontend:${{ github.sha }}
            ${{ inputs.registry }}/vortyx-frontend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_TELEMETRY_DISABLED=1
          outputs: type=image,name=${{ inputs.registry }}/vortyx-frontend,push=${{ inputs.push }}

      - name: Build Backend
        if: inputs.component == 'backend'
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.registry }}/vortyx-backend:${{ github.sha }}
            ${{ inputs.registry }}/vortyx-backend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ inputs.go_version }}
          outputs: type=image,name=${{ inputs.registry }}/vortyx-backend,push=${{ inputs.push }}
