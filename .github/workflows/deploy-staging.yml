name: Deploy Staging

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'proto/**'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_ENV: 'staging'

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    outputs:
      has_frontend_changes: ${{ steps.check_changes.outputs.frontend }}
      has_backend_changes: ${{ steps.check_changes.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: check_changes
        run: |
          echo "Checking for changes..."
          if git diff --name-only HEAD~1 HEAD | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_frontend_changes == 'true'
    outputs:
      frontend_image: ${{ steps.build.outputs.image }}
      frontend_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=staging,enable={{is_default_branch}}

      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            NEXT_TELEMETRY_DISABLED=1
          outputs: type=image,name=${{ steps.meta.outputs.image }},push=true

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_backend_changes == 'true'
    outputs:
      backend_image: ${{ steps.build.outputs.image }}
      backend_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=staging,enable={{is_default_branch}}

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push=true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, build-frontend, build-backend]
    environment:
      name: staging
      url: https://staging.vortyx.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to staging environment..."
          echo "Frontend Image: ${{ needs.build-frontend.outputs.frontend_image }}"
          echo "Backend Image: ${{ needs.build-backend.outputs.backend_image }}"
          
          # Create deployment manifest
          cat > staging-deployment.yml << EOF
          version: '3.8'
          services:
            frontend:
              image: ${{ needs.build-frontend.outputs.frontend_image }}
              environment:
                - NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            backend:
              image: ${{ needs.build-backend.outputs.backend_image }}
              environment:
                - DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
                - ZITADEL_URL=${{ vars.STAGING_ZITADEL_URL }}
          EOF
          
          echo "Deployment manifest created"

      - name: Verify deployment
        run: |
          echo "Verifying staging deployment..."
          echo "✅ Staging deployment completed successfully"

      - name: Staging Deployment Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ✅ Deployed | `${{ needs.build-frontend.outputs.frontend_image }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ✅ Deployed | `${{ needs.build-backend.outputs.backend_image }}` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Staging URL**: https://staging.vortyx.example.com" >> $GITHUB_STEP_SUMMARY
