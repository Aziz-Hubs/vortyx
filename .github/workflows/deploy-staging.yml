name: Deploy Staging

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'proto/**'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    outputs:
      has_frontend_changes: ${{ steps.check_changes.outputs.frontend }}
      has_backend_changes: ${{ steps.check_changes.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for file changes
        id: check_changes
        run: |
          echo "Checking for changes..."
          if git diff --name-only HEAD~1 HEAD | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  build-frontend:
    needs: validate
    if: needs.validate.outputs.has_frontend_changes == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      component: 'frontend'
      environment: 'staging'
      push: true
      registry: ghcr.io
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    needs: validate
    if: needs.validate.outputs.has_backend_changes == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      component: 'backend'
      environment: 'staging'
      push: true
      registry: ghcr.io
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, build-frontend, build-backend]
    if: |
      always() &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      !(needs.build-frontend.result == 'skipped' && needs.build-backend.result == 'skipped')
    environment:
      name: staging
      url: https://staging.vortyx.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to staging environment..."
          
          FRONTEND_IMAGE="${{ needs.build-frontend.outputs.image }}"
          BACKEND_IMAGE="${{ needs.build-backend.outputs.image }}"
          
          if [ -z "$FRONTEND_IMAGE" ]; then
            echo "Frontend was not rebuilt, using previous version (simulated)"
            FRONTEND_IMAGE="ghcr.io/${{ github.repository }}/vortyx-frontend:staging"
          fi
          
          if [ -z "$BACKEND_IMAGE" ]; then
            echo "Backend was not rebuilt, using previous version (simulated)"
            BACKEND_IMAGE="ghcr.io/${{ github.repository }}/vortyx-backend:staging"
          fi
          
          echo "Frontend Image: $FRONTEND_IMAGE"
          echo "Backend Image: $BACKEND_IMAGE"
          
          # Create deployment manifest
          cat > staging-deployment.yml << EOF
          version: '3.8'
          services:
            frontend:
              image: $FRONTEND_IMAGE
              environment:
                - NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            backend:
              image: $BACKEND_IMAGE
              environment:
                - DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
                - ZITADEL_URL=${{ vars.STAGING_ZITADEL_URL }}
          EOF
          
          echo "Deployment manifest created"

      - name: Verify deployment
        run: |
          echo "Verifying staging deployment..."
          echo "✅ Staging deployment completed successfully"

      - name: Staging Deployment Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FRONTEND_IMAGE="${{ needs.build-frontend.outputs.image }}"
          if [ -z "$FRONTEND_IMAGE" ]; then FRONTEND_IMAGE="(Skipped - No Changes)"; fi
          
          BACKEND_IMAGE="${{ needs.build-backend.outputs.image }}"
          if [ -z "$BACKEND_IMAGE" ]; then BACKEND_IMAGE="(Skipped - No Changes)"; fi
          
          echo "| Service | Status | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ✅ Deployed | \`$FRONTEND_IMAGE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ✅ Deployed | \`$BACKEND_IMAGE\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Staging URL**: https://staging.vortyx.example.com" >> $GITHUB_STEP_SUMMARY
