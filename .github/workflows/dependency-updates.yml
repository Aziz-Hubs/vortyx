name: Dependency Updates

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:
  pull_request:

concurrency:
  group: dependency-updates
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.24'

jobs:
  update-frontend-deps:
    name: Update Frontend Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check for outdated dependencies
        working-directory: ./frontend
        id: outdated
        run: |
          npm install
          npm outdated --json > outdated.json || true
          echo "has_outdated=$(wc -l < outdated.json)" >> $GITHUB_OUTPUT
          cat outdated.json

      - name: Update npm dependencies
        working-directory: ./frontend
        if: steps.outdated.outputs.has_outdated > 1
        run: |
          npm install
          npm update

      - name: Create Pull Request for frontend updates
        if: steps.outdated.outputs.has_outdated > 1
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update frontend dependencies'
          title: 'chore: Update Frontend Dependencies'
          body: |
            Automated dependency updates for the frontend.
            
            ### Changes
            - Updated npm packages
            
            ### Testing
            Please verify the build and tests pass.
          branch: 'dependabot/npm/frontend'
          base: main
          labels: |
            dependencies
            automated

  update-backend-deps:
    name: Update Backend Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check for outdated dependencies
        working-directory: ./backend
        id: outdated
        run: |
          go get -u ./...
          go mod tidy
          echo "has_changes=$(git diff --stat)" >> $GITHUB_OUTPUT

      - name: Create Pull Request for backend updates
        if: steps.outdated.outputs.has_changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update backend dependencies'
          title: 'chore: Update Backend Dependencies'
          body: |
            Automated dependency updates for the backend.
            
            ### Changes
            - Updated Go modules
            
            ### Testing
            Please verify the build and tests pass.
          branch: 'dependabot/go/backend'
          base: main
          labels: |
            dependencies
            automated

  update-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub Actions Dependabot
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Update actions
        uses: dawidd6/action-update-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          include: |
            .github/workflows/*.yml

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [update-frontend-deps, update-backend-deps, update-actions]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          frontend_status="${{ needs.update-frontend-deps.result }}"
          backend_status="${{ needs.update-backend-deps.result }}"
          actions_status="${{ needs.update-actions.result }}"
          
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $frontend_status |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | $backend_status |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Actions | $actions_status |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "✅ Dependency update check completed" >> $GITHUB_STEP_SUMMARY
