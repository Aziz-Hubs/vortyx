syntax = "proto3";

package vortyx.platform.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/platform/v1;platformv1";

service PlatformService {
  // User Management
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
  
  // Role Management
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  
  // Audit & Analytics
  rpc GetAuditLogs(GetAuditLogsRequest) returns (GetAuditLogsResponse);
  rpc GetSystemStats(GetSystemStatsRequest) returns (GetSystemStatsResponse);
}

// Data Models

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string role = 6; // e.g., "admin", "tech", "viewer"
  string state = 7; // e.g., "active", "locked"
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Role {
  string key = 1;
  string display_name = 2;
  string description = 3;
}

message AuditLog {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string action = 4; // e.g., "user.created", "login.success"
  string resource_type = 5;
  string resource_id = 6;
  google.protobuf.Struct details = 7;
  google.protobuf.Timestamp created_at = 8;
}

// Request/Response Messages

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  string role = 6;
}

message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search_query = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total_count = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message UpdateUserRoleRequest {
  string user_id = 1;
  string role = 2;
}

message UpdateUserRoleResponse {
  User user = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message GetAuditLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string user_id = 3;
}

message GetAuditLogsResponse {
  repeated AuditLog logs = 1;
  int32 total_count = 2;
}

message GetSystemStatsRequest {}

message GetSystemStatsResponse {
  int32 total_users = 1;
  int32 active_sessions = 2;
  int32 critical_alerts = 3;
}
