syntax = "proto3";

package vortyx.horizon.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/horizon/v1;horizonv1";

// vCIO & Strategy Service
service HorizonService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
