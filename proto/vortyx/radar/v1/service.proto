syntax = "proto3";

package vortyx.radar.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/radar/v1;radarv1";

// SIEM & Log Analysis Service
service RadarService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
