syntax = "proto3";

package vortyx.optic.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/optic/v1;opticv1";

// CCTV Surveillance Service
service OpticService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
