syntax = "proto3";

package vortyx.grid.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/grid/v1;gridv1";

// Network Management Service
service GridService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
