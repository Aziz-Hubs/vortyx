syntax = "proto3";

package vortyx.sonar.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/sonar/v1;sonarv1";

// Network Detection Service
service SonarService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
