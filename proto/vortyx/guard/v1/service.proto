syntax = "proto3";

package vortyx.guard.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/guard/v1;guardv1";

// Endpoint Detection & Response Service
service GuardService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
