syntax = "proto3";

package vortyx.signal.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/signal/v1;signalv1";

// Threat Intelligence Service
service SignalService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
