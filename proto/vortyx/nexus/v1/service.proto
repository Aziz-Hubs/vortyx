syntax = "proto3";

package vortyx.nexus.v1;

option go_package = "github.com/abdul/vortyx/backend/gen/proto/go/vortyx/nexus/v1;nexusv1";

// IT Documentation & Knowledge Base Service
service NexusService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
